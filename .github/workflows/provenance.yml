name: provenance

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: provenance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenTimestamps client
        run: pip install opentimestamps-client==0.7.2
      - name: Record, stamp, archive
        run: python scripts/update.py
      - name: Commit
        run: |
          git config user.name "locafy-provenance-bot"
          git config user.email "provenance-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "provenance: $(date -u +%F)"
          git push
